# pesigitg — sysctl ARP configuration for DSR
#
# Install: cp 90-dsr.conf /etc/sysctl.d/ && sysctl --system
#
# These settings are needed on BOTH the load balancer and the backend servers.
# Linux's default ARP behaviour ("ARP flux") responds to ARP for any local IP
# on any interface.  In a DSR topology this misdirects traffic.
#
# arp_ignore=1  — only reply to ARP if the target IP is configured on the
#                 *incoming* interface.
#
# arp_announce=2 — always use the best local address for the *outgoing*
#                  interface as the ARP source, preventing addresses from
#                  other interfaces from leaking into upstream ARP caches.
#
# --- Load balancer ---
# The LB host typically has a management interface (e.g. eno1) alongside the
# data-plane interface where XDP is attached.  Without arp_ignore=1 on the
# management NIC, it will answer ARP for the VIP — the upstream router caches
# the management MAC for the VIP and sends traffic there.  XDP only runs on
# the data-plane interface, so those packets are never forwarded to backends.
#
# --- Backends ---
# Backend servers have the VIP on loopback (see 99-dsr-vip.yaml).  Without
# arp_ignore=1, the backend answers ARP for the VIP on its physical NIC and
# the upstream router sends traffic directly to the backend, bypassing the LB.
#
# Use conf.all to apply globally, or per-interface knobs to target specific
# NICs (Linux takes the max of conf.all and conf.<iface>):
#net.ipv4.conf.eth0.arp_ignore = 1
#net.ipv4.conf.eth0.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

# Suppress IPv6 NDP Duplicate Address Detection on loopback.  Normally a
# no-op, but when adding/removing VIPs at runtime disabling DAD eliminates
# the ~1 s transition delay before the address becomes usable.
#net.ipv6.conf.lo.accept_dad = 0
