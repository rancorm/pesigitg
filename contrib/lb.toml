# Pesigitg Configuration
#

# Config rotation bits (0-6, maps to first 3 bits of CID)
# Must not use 7 (0b111) - reserved for fallback/unroutable
config_id = 0

# Whether the first octet encodes CID length in its lower 6 bits
first_octet_encodes_cid_length = true

# Single-pass AES-ECB requires server_id_length + nonce_length = 16
#
# server_id_length  nonce_length  Trade-off
# -------------------------------------------------------
#  1                15            256 servers max, longest nonce life
#  2                14            65K servers, still huge nonce space
#  3                13            16M servers, practical sweet spot
#  4                12            4B servers, overkill for most
# 12                 4            Massive server space, nonce exhausts fast

# Four-pass Feistel encryption when server_id_length + nonce_length != 16
# Valid range: server_id_length + nonce_length <= 19
#
# server_id_length  nonce_length  sum  Trade-off
# -------------------------------------------------------
#  1                 4             5   256 servers, minimal CID size
#  2                 4             6   65K servers, compact CID
#  3                 4             7   16M servers, compact CID
#  3                 8            11   16M servers, good nonce life
#  4                 4             8   4B servers, compact CID
#  1                18            19   256 servers, max CID size, longest nonce life
# 15                 4            19   Max server space, max CID size, nonce exhausts fast

# Server ID length in octets (1-15)
server_id_length = 3

# Nonce length in octets (4-18)
nonce_length = 13

# 16-byte AES-128-ECB key for CID encryption (hex-encoded)
# Omit for plaintext/unencrypted mode (not recommended for production)
key = "REPLACE_ME_WITH_A_REAL_128BIT_KEY"

# Server ID to forwarding address mappings
[[servers]]
id = "000001"
address = "10.0.1.10:433"

[[servers]]
id = "000002"
address = "10.0.1.11:433"

[[servers]]
id = "000003"
address = "10.0.1.12:433"

[[servers]]
id = "000004"
address = "[2001:db8::1]:443"
