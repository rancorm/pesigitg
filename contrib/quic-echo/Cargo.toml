[package]
name = "quic-echo"
version = "0.1.0"
edition = "2024"
description = "Minimal QUIC echo server and client with QUIC-LB compliant Connection IDs"
publish = false

[[bin]]
name = "quic-echo-server"
path = "src/server.rs"

[[bin]]
name = "quic-echo-client"
path = "src/client.rs"

[dependencies]
# QUIC transport
quinn = "0.11"
quinn-proto = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# TLS self-signed cert generation (dev/test convenience)
rcgen = "0.13"

# QUIC-LB CID generation
quic-lb-cid = { path = "../quic-lb-cid" }

# Shared helpers (hex encode/decode, etc.)
pesigitg-common = { path = "../../pesigitg-common", features = ["std"] }

# Config parsing (reads a subset of lb.toml)
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# Error handling & CLI
anyhow = "1"
