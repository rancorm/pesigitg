[package]
name = "quic-echo"
description = "Minimal QUIC echo server and client with QUIC-LB compliant Connection IDs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "quic-echo-server"
path = "src/server.rs"

[[bin]]
name = "quic-echo-client"
path = "src/client.rs"

[dependencies]
# QUIC transport
quinn = { workspace = true }
quinn-proto = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# TLS self-signed cert generation (dev/test convenience)
rcgen = { workspace = true }

# QUIC-LB CID generation
quic-lb-quinn = { workspace = true }

# Shared helpers (hex encode/decode, etc.)
pesigitg-common = { workspace = true, features = ["std"] }

# Config parsing (reads a subset of lb.toml)
serde = { workspace = true }
toml = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Error handling & CLI
anyhow = { workspace = true }
