[package]
name = "quic-lb-cid"
version = "0.1.0"
edition = "2024"
description = "QUIC-LB compliant Connection ID generator (draft-ietf-quic-load-balancers-21)"
publish = false

[dependencies]
# CID encryption
aes = { workspace = true }

# Quinn trait for ConnectionIdGenerator
quinn = { workspace = true }
quinn-proto = { workspace = true }

# RNG for nonce generation. Not using the workspace-wide pin: the daemon
# is on rand 0.10 but bumping quic-lb-cid crosses an API break that
# warrants its own audit.
rand = "0.9"
