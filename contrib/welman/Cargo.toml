[package]
name = "welman"
description = "Minimal HTTP/3 server with QUIC-LB compliant Connection IDs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "welman"
path = "src/main.rs"

[dependencies]
# QUIC transport
quinn = { workspace = true }
quinn-proto = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# HTTP/3
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"

# TLS self-signed cert generation (dev/test convenience)
rcgen = { workspace = true }

# QUIC-LB CID generation
quic-lb-quinn = { workspace = true }

# Shared helpers (hex encode/decode, etc.)
pesigitg-common = { workspace = true, features = ["std"] }

# Config parsing (reads a subset of lb.toml)
serde = { workspace = true }
toml = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Error handling
anyhow = { workspace = true }
