[package]
name = "pesigitg-daemon"
description = "A high-performance QUIC-aware load balancer, using eBPF and AF_XDP for kernel-bypass packet forwarding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pesigitgd"
path = "src/main.rs"

[dependencies]
pesigitg-common = { workspace = true, features = ["std"] }
pesigitg-routing = { workspace = true }

aya = "0.13"
aes = { workspace = true }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
anyhow = { workspace = true }
env_logger = "0.11"
log = "0.4"
nix = { version = "0.31", features = ["fs", "process", "sched", "signal"] }
pico-args = { workspace = true }
sd-notify = { version = "0.4", features = ["fdstore"] }
signal-hook = { version = "0.4", features = ["extended-siginfo"] }
syslog = "7"
libc = "0.2"
bytesize = "2.3"
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
rustc-hash = "2"
xsk-rs = "0.4"
rand = "0.10"

# QUIC health probes
quinn = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
rustls = { version = "0.23", features = ["ring"] }

[build-dependencies]
chrono = "0.4"
