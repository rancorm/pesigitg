[package]
name = "pesigitg-common"
description = "Shared no_std-friendly helpers (hex, MAC) for the pesigitg daemon and eBPF crates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = [] # gates std-dependent code

[dependencies]
# no_std-compatible dependencies only here

# Self-reference with `std` enabled so `cargo test -p pesigitg-common` runs the
# `hex` and `mac` module tests — they live behind `#[cfg(feature = "std")]` and
# would otherwise silently report "0 passed" under the no_std default.
[dev-dependencies]
pesigitg-common = { path = ".", features = ["std"] }
