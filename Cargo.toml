[workspace]
resolver = "2"
members = [
	"pesigitg-daemon",
	"pesigitg-daemon/fuzz",
	"pesigitg-common",
	"pesigitg-control",
	"pesigitg-routing",
	"xtask",
	"contrib/quic-lb-cid",
	"contrib/quic-echo",
	"contrib/welman"
]
exclude = ["pesigitg-ebpf"]
default-members = ["pesigitg-daemon", "pesigitg-common"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/rancorm/pesigitg"

[workspace.dependencies]
# Internal path crates. A version is declared alongside `path` so
# `cargo deny check bans` accepts the entry (crates.io rejects pure
# path deps) and to enable a future publish without churn.
pesigitg-common = { path = "pesigitg-common", version = "0.1.0" }
pesigitg-routing = { path = "pesigitg-routing", version = "0.1.0" }
quic-lb-cid = { path = "contrib/quic-lb-cid", version = "0.1.0" }

# Crypto
aes = "0.8"

# QUIC / TLS. `rustls = "0.23"` stays declared per-crate: the daemon
# keeps default features on, contrib opts out + explicitly requests
# `std`, and Cargo doesn't allow crate-level overrides of a workspace
# dep's `default-features`.
quinn = "0.11"
quinn-proto = "0.11"
rcgen = "0.13"

# Async
tokio = "1.50"

# Config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1"

# Arguments
pico-args = { version = "0.5", features = ["short-space-opt", "combined-flags"] }

[profile.release]
opt-level = 3
lto = true        # link-time optimization across crates
codegen-units = 1 # slower compile, but better optimization
panic = "abort"   # no unwinding overhead in the fast path
strip = "symbols" # smaller binary, slight startup benefit
